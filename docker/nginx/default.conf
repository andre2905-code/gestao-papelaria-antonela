# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Reverse Proxy para Laravel + React (Vite)
#
# Roteamento:
#   /api/*          → PHP-FPM (Laravel) — container "api" na porta 9000
#   /sanctum/*      → PHP-FPM (Laravel) — para autenticação Sanctum/CSRF
#   /storage/*      → Arquivos públicos do Laravel (ex: uploads)
#   /                → Vite dev server (React) — container "frontend" na porta 5173
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    charset utf-8;
    client_max_body_size 64M;

    # ── Headers de segurança básicos ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ─────────────────────────────────────────────────────────────────────────
    # Rotas do Laravel (Backend)
    # Qualquer rota que comece com /api ou /sanctum é tratada pelo PHP-FPM
    # ─────────────────────────────────────────────────────────────────────────
    location ~ ^/(api|sanctum)(/.*)?$ {
        root /var/www/api/public;
        index index.php;

        # Tenta servir o arquivo/diretório; caso contrário, passa para index.php
        try_files $uri $uri/ /index.php?$query_string;

        # ── Processa arquivos PHP via PHP-FPM ──────────────────────────────
        location ~ \.php$ {
            fastcgi_pass api:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;

            fastcgi_read_timeout 300;
            fastcgi_buffering on;
        }
    }

    # ── Fallback PHP para as rotas Laravel que não casaram acima ───────────
    location ~ \.php$ {
        root /var/www/api/public;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        include fastcgi_params;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Arquivos de storage do Laravel (links simbólicos publicados via artisan)
    # ─────────────────────────────────────────────────────────────────────────
    location /storage {
        root /var/www/api/public;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Frontend React — proxy para o Vite dev server
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;

        # Necessário para WebSocket (HMR do Vite)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}
