version: '3.8'

services:

  # ─── Nginx (Reverse Proxy) ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: app_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/api:ro          # necessário para servir arquivos estáticos do Laravel
    depends_on:
      - api
      - frontend
    networks:
      - app_network
    restart: unless-stopped

  # ─── Laravel (PHP-FPM) ───────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: app_api
    volumes:
      - ./api:/var/www/api             # hot-reload do código PHP em dev
      - api_vendor:/var/www/api/vendor # vendor isolado no container
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:changeme==}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # ─── React (Vite Dev Server) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    volumes:
      - ./frontend:/app                 # hot-reload do código React em dev
      - frontend_node_modules:/app/node_modules  # node_modules isolado no container
    environment:
      - VITE_API_URL=/api              # URL base da API acessada pelo browser
    networks:
      - app_network
    restart: unless-stopped

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: app_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"                    # expõe para acesso local (ex: DBeaver, TablePlus)
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  api_vendor:
  frontend_node_modules:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
